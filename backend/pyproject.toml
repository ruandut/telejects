[project]
name = "telejects-backend"
version = "0.1.0"
description = "Telejects API: Django + DRF + JWT + Hatchet + Postgres"
authors = [{ name = "Ruan" }]
requires-python = ">=3.14"
dependencies = [
    "channels>=4.3.2",
    "cryptography>=50.0.2",
    "daphne>=4.2.3",
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "hatchet-sdk>=1.43.0",
    "httpx>=0.28.1",
    "jmespath>=1.1.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
